name: Noor & Co Website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      generate_blog:
        description: "Generate a new blog post using Gemini"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate blog with Gemini
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_blog) }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python automation/generate_blog.py

      - name: Commit generated blog
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_blog) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts automation/topic_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish automated blog post"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
